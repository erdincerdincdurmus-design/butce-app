<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cüzdanım - Güvenli & Yedeklenebilir Bütçe Takipçisi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1C1C1E; color: #FFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* ŞİFRELEME EKRANI TASARIMI */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1C1C1E; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: #2C2C2E; padding: 40px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; width: 100%; max-width: 400px; }
        .login-card h2 { margin-bottom: 10px; font-size: 24px; }
        .login-card p { color: #8E8E93; font-size: 14px; margin-bottom: 20px; }
        .login-card input { width: 100%; text-align: center; font-size: 20px; letter-spacing: 4px; margin-bottom: 15px; background: #3A3A3C; border: none; padding: 12px; border-radius: 8px; color: #FFF; outline: none; }
        .login-card button { width: 100%; }
        .error-msg { color: #FF3B30; font-size: 13px; margin-top: 10px; display: none; }

        /* ANA UYGULAMA TASARIMI */
        .app-container { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; width: 100%; max-width: 1000px; background: #2C2C2E; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .app-container.show { opacity: 1; pointer-events: auto; }
        
        .header-area { grid-column: 1 / -1; border-bottom: 1px solid #3A3A3C; padding-bottom: 15px; margin-bottom: 10px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        
        .summary-card { background: #3A3A3C; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .bakiye-label { color: #AEAEE2; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .bakiye-text { font-size: 32px; font-weight: bold; margin: 5px 0; color: #4CD964; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid #48484A; padding-top: 15px; }
        .stat-item p { font-size: 12px; color: #8E8E93; }
        .stat-item span { font-size: 16px; font-weight: 600; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #3A3A3C; padding-bottom: 20px; }
        input, select.form-select { background: #3A3A3C; border: none; padding: 12px; border-radius: 8px; color: #FFF; font-size: 14px; outline: none; }
        input::placeholder { color: #8E8E93; }
        button { background: #007AFF; color: #FFF; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0062CC; }
        
        .month-selection-box { background: #3A3A3C; padding: 15px; border-radius: 12px; max-height: 150px; overflow-y: auto; margin-bottom: 15px; }
        .month-box-title { font-size: 13px; color: #AEAEE2; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: bold; }
        .month-checkbox-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; }
        .month-checkbox-item input { width: auto; margin: 0; cursor: pointer; scale: 1.2; }

        /* YEDEKLEME ALANI TASARIMI */
        .backup-group { display: flex; gap: 10px; }
        .backup-btn { flex: 1; padding: 10px; font-size: 12px; background: #3A3A3C; color: #FFF; border: 1px solid #48484A; }
        .backup-btn:hover { background: #48484A; }

        .list-section { background: #3A3A3C; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; height: 100%; min-height: 520px; max-height: 620px; }
        .list-title-container { border-bottom: 1px solid #48484A; padding-bottom: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .list-title-top { display: flex; justify-content: space-between; align-items: center; }
        .list-title { font-size: 18px; }
        .list-count { font-size: 14px; color: #8E8E93; }
        .search-input { background: #2C2C2E !important; border: 1px solid #48484A !important; padding: 8px 12px !important; font-size: 13px !important; width: 100%; border-radius: 6px; }
        
        .transaction-list { overflow-y: auto; flex: 1; list-style: none; padding-right: 5px; }
        .transaction-item { background: #2C2C2E; padding: 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-left: 4px solid #FF3B30; }
        .transaction-item.gelir { border-left-color: #4CD964; }
        .item-info { display: flex; flex-direction: column; }
        .item-title { font-weight: 500; font-size: 15px; }
        .item-date { font-size: 11px; color: #8E8E93; margin-top: 2px; background: #3A3A3C; padding: 2px 6px; border-radius: 4px; width: fit-content; }
        .item-amount { font-weight: 600; }
        .item-amount.gelir { color: #4CD964; }
        .item-amount.gider { color: #FF3B30; }
        .delete-btn { background: none; color: #8E8E93; padding: 5px 10px; font-size: 14px; border-radius: 50%; }
        .delete-btn:hover { color: #FF3B30; background: rgba(255,59,48,0.1); }
        .empty-text { color: #8E8E93; text-align: center; margin-top: 40px; font-style: italic; }
    </style>
</head>
<body>

    <!-- GİRİŞ / ŞİFRE PANELİ -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2 id="loginTitle">Cüzdanım Güvenlik</h2>
            <p id="loginDesc">Lütfen giriş şifrenizi yazın.</p>
            <input type="password" id="passwordInput" placeholder="••••" maxlength="8">
            <button onclick="checkPassword()" id="loginBtn">Giriş Yap</button>
            <div class="error-msg" id="errorMsg">Hatalı şifre! Lütfen tekrar deneyin.</div>
        </div>
    </div>

    <!-- ANA UYGULAMA PANELİ -->
    <div class="app-container" id="appContainer">
        <div class="header-area">
            <h1>Cüzdanım</h1>
            <p style="color: #8E8E93; font-size: 14px;">Güvenli, Çoklu Dönem & Yedeklenebilir Bütçe Takipçisi</p>
        </div>

        <div class="left-panel">
            <div class="summary-card">
                <span class="bakiye-label" id="bakiyeLabel">Seçili Dönem Toplam Bakiyesi</span>
                <div class="bakiye-text" id="netBakiye">0 ₺</div>
                <div class="stats">
                    <div class="stat-item">
                        <p>Toplam Gelir</p>
                        <span style="color: #4CD964;" id="toplamGelir">+0 ₺</span>
                    </div>
                    <div class="stat-item">
                        <p>Toplam Gider</p>
                        <span style="color: #FF3B30;" id="toplamGider">-0 ₺</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="txTitle" placeholder="İşlem adı (örn: Kira, Maaş)">
                <input type="number" id="txAmount" placeholder="Tutar (₺)">
                <select class="form-select" id="txType">
                    <option value="gider">Gider</option>
                    <option value="gelir">Gelir</option>
                </select>
                <select class="form-select" id="txTargetMonth" style="background: #2C2C2E; border: 1px solid #3A3A3C;">
                </select>
                <button onclick="addTransaction()">Yeni İşlemi Kaydet</button>
            </div>

            <div class="month-selection-box">
                <div class="month-box-title">Dönem Filtresi (Çoklu Seçim)</div>
                <div id="monthCheckboxContainer"></div>
            </div>

            <!-- YEDEKLEME BUTONLARI -->
            <div class="backup-group">
                <button class="backup-btn" onclick="exportBackup()">📥 Verileri Yedekle</button>
                <button class="backup-btn" onclick="document.getElementById('importFile').click()">📤 Yedeği Yükle</button>
                <input type="file" id="importFile" style="display:none" onchange="importBackup(event)" accept=".json">
            </div>
        </div>

        <div class="list-section">
            <div class="list-title-container">
                <div class="list-title-top">
                    <span class="list-title">Seçili Ayların İşlemleri</span>
                    <span class="list-count" id="listCount">0 işlem</span>
                </div>
                <input type="text" id="searchFilter" class="search-input" placeholder="🔍 İsme göre ara (örn: Market, Kira...)" oninput="updateUI()">
            </div>
            <ul class="transaction-list" id="txList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
